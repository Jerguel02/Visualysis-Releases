<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Tech Gradient: Deep Blue -> Cyan -> Purple -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" /> <!-- Dark -->
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" /> <!-- Blue -->
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" /> <!-- Cyan -->
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" /> <!-- Cyan 400 -->
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" /> <!-- Pink 400 -->
    </linearGradient>

    <filter id="lensGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#lensGlow)">
    <!-- THE HORIZONTAL "V" (Eye Corner / Camera Body) -->
    <!-- Shaped like a '<' opening to the right, representing the eye socket or camera housing -->
    <path d="M 380 80 C 250 80, 80 256, 80 256 C 80 256, 250 432, 380 432" 
          stroke="url(#lensGrad)" 
          stroke-width="40" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none" />
    
    <!-- THE CAMERA LENS (Iris) -->
    <!-- Nested inside the V, with aperture blade details -->
    <g transform="translate(260, 256)">
      <!-- Outer Lens Ring -->
      <circle cx="0" cy="0" r="90" 
              stroke="#cbd5e1" 
              stroke-width="8" 
              fill="none" 
              opacity="0.5"/>
              
      <!-- Inner Lens / Aperture -->
      <circle cx="0" cy="0" r="70" 
              fill="url(#lensGrad)" 
              opacity="0.9" />
              
      <!-- Aperture Blades (Stylized) -->
      <path d="M -40 -50 L 0 -70 L 40 -50 L 40 50 L 0 70 L -40 50 Z" 
            stroke="white" 
            stroke-width="2" 
            opacity="0.3" 
            fill="none" />
            
      <!-- Lens Reflection -->
      <path d="M -30 -30 Q -10 -50, 20 -40" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- THE HEARTBEAT / EKG WAVE -->
    <!-- Runs through the lens, signifying analysis/processing -->
    <path d="M 140 256 L 200 256 L 230 190 L 260 320 L 290 220 L 320 256 L 440 256" 
          stroke="url(#waveGrad)" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
